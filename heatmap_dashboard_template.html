<script id="heatmap-data" type="application/json">__DATA__</script>
<script>
// ── Theme toggle ──
function toggleTheme() {
  var d = document.documentElement;
  d.classList.toggle('dark');
  localStorage.setItem('kanban-theme', d.classList.contains('dark') ? 'dark' : 'light');
  // Refresh charts to use new theme colors
  if (typeof renderChart === 'function') renderChart();
}

// ── CSS variable reader for LWC chart colors ──
function _c(varName, fallback) {
  try {
    var v = getComputedStyle(document.documentElement).getPropertyValue(varName).trim();
    if (!v) return fallback;
    // Handle rgba() format for equity top/bottom
    if (varName.indexOf('equity') >= 0) {
      var parts = v.split(' ');
      if (parts.length === 4) {
        return 'rgba(' + parts[0] + ',' + parts[1] + ',' + parts[2] + ',' + parts[3] + ')';
      }
    }
    return 'hsl(' + v + ')';
  } catch(e) { return fallback; }
}

try {
var D = JSON.parse(document.getElementById('heatmap-data').textContent);
var ALL_KTYPES = ["1w","1d"];
var ALL_MARKETS = ["us","cc","cn"];
var KT_LABELS = {"1w":"周K","1d":"日K"};
var MK_LABELS = {"us":"美股","cc":"加密货币","cn":"A股"};
var CHART_TYPES = ["K线图","参数稳定性评分热力图","参数敏感性分析","策略评分热力图","年化收益率热力图","夏普比率热力图","最大回撤热力图"];
var currentKtype = null, currentMarket = null, currentType = "K线图";

function init() {
  renderNavs();
  renderChartNav();
  for(var i=0;i<ALL_KTYPES.length;i++) {
    for(var j=0;j<ALL_MARKETS.length;j++) {
      var d=D[ALL_KTYPES[i]][ALL_MARKETS[j]];
      if(d&&d.stocks&&d.stocks.length) { selectKtype(ALL_KTYPES[i]); selectMarket(ALL_MARKETS[j]); return; }
    }
  }
}

function renderNavs() {
  var h="";
  for(var i=0;i<ALL_KTYPES.length;i++) {
    var k=ALL_KTYPES[i];
    h+="<button class=\"flex flex-1 items-center justify-center rounded-[4px] text-[13px] font-medium transition-colors text-muted-foreground data-[active=true]:bg-[#404040] data-[active=true]:text-white\" data-ktype=\""+k+"\" onclick=\"selectKtype('"+k+"')\">"+KT_LABELS[k]+"</button>";
  }
  document.getElementById("nav-ktype").innerHTML=h;
  h="";
  for(var i=0;i<ALL_MARKETS.length;i++) {
    var m=ALL_MARKETS[i];
    h+="<button class=\"flex flex-1 items-center justify-center rounded-[4px] text-[13px] font-medium transition-colors text-muted-foreground data-[active=true]:bg-[#404040] data-[active=true]:text-white\" data-market=\""+m+"\" onclick=\"selectMarket('"+m+"')\">"+MK_LABELS[m]+"</button>";
  }
  document.getElementById("nav-market").innerHTML=h;
}

function renderChartNav() {
  var h="";
  var _icons = [
    '<path d=\"M18 20V10\"/><path d=\"M12 20V4\"/><path d=\"M6 20v-6\"/>',
    '<polyline points=\"22 12 18 12 15 21 9 3 6 12 2 12\"/>',
    '<path d=\"M15 3h6v6M9 21H3v-6M21 3l-7 7M3 21l7-7\"/>',
    '<path d=\"M12 20V10\"/><path d=\"M18 20V4\"/><path d=\"M6 20v-6\"/>',
    '<path d=\"M12 2v20M2 12h20\"/>',
    '<polyline points=\"22 12 18 12 15 21 9 3 6 12 2 12\"/>',
    '<path d=\"M18 20V10\"/><path d=\"M12 20V4\"/><path d=\"M6 20v-6\"/>',
  ];
  for(var i=0;i<CHART_TYPES.length;i++) {
    h+="<button class=\"flex flex-1 items-center justify-center gap-1 rounded-[4px] text-[13px] font-medium transition-colors text-muted-foreground data-[active=true]:bg-[#404040] data-[active=true]:text-white\" data-chart=\""+CHART_TYPES[i]+"\" onclick=\"selectType('"+CHART_TYPES[i]+"')\">"+
      "<svg class=\"shrink-0\" xmlns=\"http://www.w3.org/2000/svg\" width=\"14\" height=\"14\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\">"+_icons[i]+"</svg>"+
      CHART_TYPES[i]+"</button>";
  }
  document.getElementById("nav-chart").innerHTML=h;
  document.querySelector("#nav-chart button").dataset.active = "true";
}

function selectType(type) {
  currentType=type;
  document.querySelectorAll("#nav-chart button").forEach(function(el){el.dataset.active=el.dataset.chart===type ? 'true' : 'false';});
  renderChart();
}

function getCombination() {
  if(!currentKtype||!currentMarket) return null;
  return D[currentKtype][currentMarket];
}

function selectKtype(k) {
  currentKtype=k;
  document.querySelectorAll("#nav-ktype button").forEach(function(el){el.dataset.active=el.dataset.ktype===k ? 'true' : 'false';});
  renderCombination();
}

function selectMarket(m) {
  currentMarket=m;
  document.querySelectorAll("#nav-market button").forEach(function(el){el.dataset.active=el.dataset.market===m ? 'true' : 'false';});
  renderCombination();
}

function renderCombination() {
  var combo=getCombination();
  if(!combo||!combo.stocks||!combo.stocks.length) {
    document.getElementById("stock-list").innerHTML="";
    document.getElementById("stock-count").textContent="";
    document.getElementById("empty-state").style.display="";
    document.getElementById("empty-state").textContent="请先进行回测";
    document.getElementById("lwc-container").style.display="none";
    document.getElementById("plotly-container").style.display="none";
    document.getElementById("section-cards").style.display="none";
    return;
  }
  document.getElementById("empty-state").textContent="";
  document.getElementById("lwc-container").style.display="none";
  document.getElementById("plotly-container").style.display="none";
  renderStockList(combo.stocks, combo.figures);
  if(currentStock&&!combo.figures[currentStock]) currentStock=null;
  if(!currentStock) {
    for(var i=0;i<combo.stocks.length;i++) {var c=combo.stocks[i].code; if(combo.figures[c]&&Object.keys(combo.figures[c]).length) { selectStock(c); return; } }
  } else {
    renderChart();
  }
}

var currentStock=null;
var _SIG_COLORS = {"买入":"#22c55e","卖出":"#ef4444","持有":"#3b82f6","等待":"#9ca3af"};
function renderStockList(stocks, figs) {
  var h="";
  for(var i=0;i<stocks.length;i++) {
    var s=stocks[i], f=figs[s.code], ok=f&&Object.keys(f).length;
    if(s.code==="__ALL__") {
      h+="<div class=\"stock-item all-stock\" data-code=\"__ALL__\" onclick=\"selectStock('__ALL__')\">"+
          "<div class=\"flex flex-col\"><span class=\"code\">📊 "+s.name+"</span></div>"+
          "<span class=\"stock-status\" style=\"color:hsl(var(--muted-foreground));\">全市场</span></div>";
    } else {
      var _sig = s.signal || "";
      var _dot = _sig && _SIG_COLORS[_sig] ? '<span style="display:inline-block;width:8px;height:8px;border-radius:50%;background:'+_SIG_COLORS[_sig]+';margin-right:4px;vertical-align:middle;"></span>' : '';
      h+="<div class=\"stock-item"+(ok?"":" no-data")+"\" data-code=\""+s.code+"\" onclick=\"selectStock('"+s.code+"')\">"+
          "<div class=\"flex flex-col\"><span class=\"code\">"+s.code+"</span>"+(s.name?"<span class=\"name\">"+s.name+"</span>":"")+"</div>"+
          "<span class=\"stock-status\">"+_dot+_sig+"</span></div>";
    }
  }
  document.getElementById("stock-list").innerHTML=h;
  document.getElementById("stock-count").textContent="共 "+stocks.length+" 只股票";
}

function filterStocks(kw) {
  kw=kw.toLowerCase();
  var items=document.querySelectorAll("#stock-list .stock-item:not([style*=\"display:none\"])");
  var cnt=0;
  for(var i=0;i<items.length;i++) {
    var t=items[i].textContent.toLowerCase(), m=t.indexOf(kw)>=0;
    items[i].style.display=m?"":"none";
    if(m) cnt++;
  }
  document.getElementById("stock-count").textContent="显示 "+cnt+" / "+document.querySelectorAll("#stock-list .stock-item").length+" 只股票";
}

function selectFirstVisible() {
  var items=document.querySelectorAll("#stock-list .stock-item:not([style*=\"display:none\"])");
  if(items.length>0) selectStock(items[0].dataset.code);
}

function selectStock(code) {
  currentStock=code;
  document.querySelectorAll(".stock-item").forEach(function(el){el.classList.toggle("active",el.dataset.code===code);});
  if(code==="__ALL__") { currentType="全股票最优参数变动"; }
  else if(CHART_TYPES.indexOf(currentType)<0) { currentType=CHART_TYPES[0]; }
  document.querySelectorAll("#nav-chart button").forEach(function(el){el.dataset.active=el.dataset.chart===currentType ? 'true' : 'false';});
  renderChart();
}

var _lwcChart = null;
var _PCT_KEYS = {'收益率':1,'年化收益率':1,'买入持有收益率':1,'超额收益率':1,'最大回撤':1,'盈利交易率':1,'平均每笔收益率':1};
function _fmt(key, v) {
  if(v === null || v === undefined || v === '') return '-';
  var n = Number(v);
  if(isNaN(n)) return String(v);
  if(_PCT_KEYS[key]) return n.toFixed(2) + '%';
  if(key === '交易次数') return n.toFixed(0);
  return n.toFixed(2);
}
