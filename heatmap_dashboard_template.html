<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>统一热力图看板 - __TIMESTAMP__</title>
<script src="lwc.js"></script>
<script src="https://cdn.plot.ly/plotly-2.35.2.min.js"></script>
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body { font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif; display:flex; height:100vh; overflow:hidden; background:#f5f5f5; }
#sidebar { width:280px; min-width:280px; background:#fff; border-right:1px solid #e0e0e0; display:flex; flex-direction:column; }
#sidebar-header { padding:14px 16px; border-bottom:1px solid #e0e0e0; }
#sidebar-header h2 { font-size:15px; color:#333; }
#search-wrap { padding:10px 16px; }
#search { width:100%; padding:7px 10px; border:1px solid #ddd; border-radius:5px; font-size:13px; outline:none; }
#search:focus { border-color:#007bff; }
#stock-count { padding:2px 16px 8px; font-size:11px; color:#999; }
#stock-list { flex:1; overflow-y:auto; }
.stock-item { padding:7px 16px; cursor:pointer; border-bottom:1px solid #f0f0f0; display:flex; justify-content:space-between; }
.stock-item:hover { background:#f0f7ff; }
.stock-item.active { background:#007bff; color:#fff; }
.stock-item .code-name { display:flex; align-items:baseline; gap:6px; }
.stock-item .code { font-weight:600; font-size:13px; }
.stock-item .name { font-size:11px; color:#999; }
.stock-item.active .name { color:#cce5ff; }
#main { flex:1; display:flex; flex-direction:column; overflow:auto; }
#nav-chart, #nav-market, #nav-ktype { background:#fff; border-bottom:1px solid #e0e0e0; padding:0 16px; display:flex; }
.tab { padding:8px 16px; cursor:pointer; font-size:13px; color:#666; border-bottom:2px solid transparent; transition:all 0.2s; white-space:nowrap; }
.tab:hover { color:#333; background:#f8f9fa; }
.tab.active { color:#007bff; border-bottom-color:#007bff; font-weight:500; }
.tab.no-data { color:#ccc; cursor:not-allowed; }
#chart-area { flex:1; padding:16px; overflow:auto; display:flex; flex-direction:column; align-items:stretch; justify-content:flex-start; }
#lwc-container { width:100%; background:#fff; border:1px solid #e0e0e0; border-radius:4px; }
#chart-container { width:100%; height:500px; position:relative; }
#plotly-container { width:100%; background:#fff; border:1px solid #e0e0e0; border-radius:4px; overflow:auto; }
#chart-container { width:100%; height:530px; position:relative; }
#metrics-panel { display:none; width:100%; padding:8px 16px; background:#fff; border:1px solid #e0e0e0; border-radius:4px; margin-bottom:8px; }
#equity-container { width:100%; background:#fff; border:1px solid #e0e0e0; border-radius:4px; }
#trade-table { width:100%; background:#fff; border:1px solid #e0e0e0; }
#empty-state { color:#999; font-size:14px; }
</style>
</head>
<body>
<div id="sidebar">
  <div id="sidebar-header"><h2>热力图看板</h2><div style="font-size:11px;color:#999;margin-top:4px;">__TIMESTAMP__</div></div>
  <div id="search-wrap"><input id="search" type="text" placeholder="搜索股票代码/名称..."
       oninput="filterStocks(this.value)" onkeydown="if(event.key==='Enter')selectFirstVisible()"></div>
  <div id="stock-count"></div>
  <div id="stock-list"></div>
</div>
<div id="main">
  <div id="nav-market"></div>
  <div id="nav-ktype"></div>
  <div id="nav-chart"></div>
  <div id="chart-area">
    <div id="metrics-panel"></div>
    <div id="lwc-container" style="display:none;position:relative;"><div id="chart-container" style="height:500px;position:relative;"></div></div>
    <div id="plotly-container" style="display:none;position:relative;"></div>
    <div id="equity-container" style="display:none;margin-top:8px;border-radius:4px;"></div>
    <div id="trade-table" style="display:none;margin-top:8px;border-radius:4px;overflow:auto;"></div>
    <div id="empty-state">请选择周期和市场</div>
  </div>
</div>
<script id="heatmap-data" type="application/json">__DATA__</script>
<script>
try {
var D = JSON.parse(document.getElementById('heatmap-data').textContent);
var ALL_KTYPES = ["1W","1D"];
var ALL_MARKETS = ["us","cc","cn"];
var KT_LABELS = {"1W":"周K","1D":"日K"};
var MK_LABELS = {"us":"US","cc":"CC","cn":"CN"};
var CHART_TYPES = ["K线图","参数稳定性评分","参数敏感性分析","策略评分","年化收益率","夏普比率","最大回撤"];
var currentKtype = null, currentMarket = null, currentType = "策略评分";

function init() {
  renderNavs();
  renderChartNav();
  for(var i=0;i<ALL_KTYPES.length;i++) {
    for(var j=0;j<ALL_MARKETS.length;j++) {
      var d=D[ALL_KTYPES[i]][ALL_MARKETS[j]];
      if(d&&d.stocks&&d.stocks.length) { selectKtype(ALL_KTYPES[i]); selectMarket(ALL_MARKETS[j]); return; }
    }
  }
}

function renderNavs() {
  var h="";
  for(var i=0;i<ALL_KTYPES.length;i++) {
    var k=ALL_KTYPES[i];
    h+="<div class=\"tab\" data-ktype=\""+k+"\" onclick=\"selectKtype('"+k+"')\">"+KT_LABELS[k]+"</div>";
  }
  document.getElementById("nav-ktype").innerHTML=h;
  h="";
  for(var i=0;i<ALL_MARKETS.length;i++) {
    h+="<div class=\"tab\" data-market=\""+ALL_MARKETS[i]+"\" onclick=\"selectMarket('"+ALL_MARKETS[i]+"')\">"+MK_LABELS[ALL_MARKETS[i]]+"</div>";
  }
  document.getElementById("nav-market").innerHTML=h;
}

function renderChartNav() {
  var h="";
  for(var i=0;i<CHART_TYPES.length;i++) {
    h+="<div class=\"tab\" data-chart=\""+CHART_TYPES[i]+"\" onclick=\"selectType('"+CHART_TYPES[i]+"')\">"+CHART_TYPES[i]+"</div>";
  }
  document.getElementById("nav-chart").innerHTML=h;
  document.querySelector("#nav-chart .tab").classList.add("active");
}

function selectType(type) {
  currentType=type;
  document.querySelectorAll("#nav-chart .tab").forEach(function(el){el.classList.toggle("active",el.dataset.chart===type);});
  renderChart();
}

function getCombination() {
  if(!currentKtype||!currentMarket) return null;
  return D[currentKtype][currentMarket];
}

function selectKtype(k) {
  currentKtype=k;
  document.querySelectorAll("#nav-ktype .tab").forEach(function(el){el.classList.toggle("active",el.dataset.ktype===k);});
  renderCombination();
}

function selectMarket(m) {
  currentMarket=m;
  document.querySelectorAll("#nav-market .tab").forEach(function(el){el.classList.toggle("active",el.dataset.market===m);});
  renderCombination();
}

function renderCombination() {
  var combo=getCombination();
  if(!combo||!combo.stocks||!combo.stocks.length) {
    document.getElementById("stock-list").innerHTML="";
    document.getElementById("stock-count").textContent="";
    document.getElementById("empty-state").style.display="";
    document.getElementById("empty-state").textContent="请先进行回测";
    document.getElementById("lwc-container").style.display="none";
    document.getElementById("plotly-container").style.display="none";
    return;
  }
  document.getElementById("empty-state").textContent="";
  document.getElementById("lwc-container").style.display="none";
  document.getElementById("plotly-container").style.display="none";
  renderStockList(combo.stocks, combo.figures);
  if(currentStock&&!combo.figures[currentStock]) currentStock=null;
  if(!currentStock) {
    for(var i=0;i<combo.stocks.length;i++) {var c=combo.stocks[i].code; if(combo.figures[c]&&Object.keys(combo.figures[c]).length) { selectStock(c); return; } }
  } else {
    renderChart();
  }
}

var currentStock=null;
function renderStockList(stocks, figs) {
  var h="";
  for(var i=0;i<stocks.length;i++) {
    var s=stocks[i], f=figs[s.code], ok=f&&Object.keys(f).length;
    if(s.code==="__ALL__") {
      h+="<div class=\"stock-item\" data-code=\"__ALL__\" onclick=\"selectStock('__ALL__')\" style=\"background:#fff3cd;font-weight:600;\">"+
          "<div class=\"code-name\"><span class=\"code\">📊 "+s.name+"</span></div>"+
          "<span style=\"font-size:10px;color:#27ae60;\">全市场</span></div>";
    } else {
      h+="<div class=\"stock-item\" data-code=\""+s.code+"\" onclick=\"selectStock('"+s.code+"')\">"+
          "<div class=\"code-name\"><span class=\"code\">"+s.code+"</span>"+(s.name?"<span class=\"name\">"+s.name+"</span>":"")+"</div>"+
          "<span style=\"font-size:10px;color:"+(ok?"#27ae60":"#ccc")+";\">"+(ok?"有数据":"无数据")+"</span></div>";
    }
  }
  document.getElementById("stock-list").innerHTML=h;
  document.getElementById("stock-count").textContent="共 "+stocks.length+" 只股票";
}

function filterStocks(kw) {
  kw=kw.toLowerCase();
  var items=document.querySelectorAll("#stock-list .stock-item:not([style*=\"display:none\"])");
  var cnt=0;
  for(var i=0;i<items.length;i++) {
    var t=items[i].textContent.toLowerCase(), m=t.indexOf(kw)>=0;
    items[i].style.display=m?"":"none";
    if(m) cnt++;
  }
  document.getElementById("stock-count").textContent="显示 "+cnt+" / "+document.querySelectorAll("#stock-list .stock-item").length+" 只股票";
}

function selectFirstVisible() {
  var items=document.querySelectorAll("#stock-list .stock-item:not([style*=\"display:none\"])");
  if(items.length>0) selectStock(items[0].dataset.code);
}

function selectStock(code) {
  currentStock=code;
  document.querySelectorAll(".stock-item").forEach(function(el){el.classList.toggle("active",el.dataset.code===code);});
  if(code==="__ALL__") { currentType="全股票最优参数变动"; }
  else if(CHART_TYPES.indexOf(currentType)<0) { currentType=CHART_TYPES[0]; }
  document.querySelectorAll("#nav-chart .tab").forEach(function(el){el.classList.toggle("active",el.dataset.chart===currentType);});
  renderChart();
}

var _lwcChart = null;
var _PCT_KEYS = {'收益率':1,'年化收益率':1,'买入持有收益率':1,'超额收益率':1,'最大回撤':1,'盈利交易率':1,'平均每笔收益率':1};
function _fmt(key, v) {
  if(v === null || v === undefined || v === '') return '-';
  var n = Number(v);
  if(isNaN(n)) return String(v);
  if(_PCT_KEYS[key]) return n.toFixed(2) + '%';
  if(key === '交易次数') return n.toFixed(0);
  return n.toFixed(2);
}
var _eqChart = null;
function renderChart() {
  document.getElementById('metrics-panel').style.display = 'none';
  document.getElementById('equity-container').style.display = 'none';
  document.getElementById('trade-table').style.display = 'none';
  document.getElementById('lwc-container').style.display = 'none';
  document.getElementById('plotly-container').style.display = 'none';
  if(!currentStock||!currentKtype||!currentMarket) return;
  var combo=D[currentKtype][currentMarket];
  if(!combo||!combo.figures) return;
  var figs=combo.figures[currentStock];
  if(!figs||!figs[currentType]) {
    document.getElementById("empty-state").style.display="";
    document.getElementById("empty-state").textContent="该股票暂无数据";
    return;
  }
  document.getElementById("empty-state").style.display="none";

  // 清理旧图表
  if(_lwcChart) { _lwcChart.remove(); _lwcChart = null; }
  if(_eqChart) { _eqChart.remove(); _eqChart = null; }
  Plotly.purge("plotly-container");

  if(figs[currentType]._lwc) {
    document.getElementById('lwc-container').style.display = 'block';
    _lwcChart = LightweightCharts.createChart(document.getElementById("chart-container"), {
      layout: { textColor: '#333', background: { type: 'solid', color: '#fff' } },
      grid: { vertLines: { color: '#e0e0e0' }, horzLines: { color: '#e0e0e0' } },
      crosshair: { mode: LightweightCharts.CrosshairMode.Normal },
      timeScale: { borderColor: '#ddd' },
      rightPriceScale: { borderColor: '#ddd' },
      height: 500,
    });
    var d = figs[currentType];
    var cs = _lwcChart.addSeries(LightweightCharts.CandlestickSeries, {
      upColor: '#000000', downColor: '#b0b0b0',
      borderUpColor: '#000000', borderDownColor: '#b0b0b0',
      wickUpColor: '#000000', wickDownColor: '#b0b0b0',
    });
    cs.setData(d.candles);
    if(d.mas && d.mas.length) {
      var ml = _lwcChart.addSeries(LightweightCharts.LineSeries, {
        color: '#f5c542', lineWidth: 1.5, priceLineVisible: false,
      });
      ml.setData(d.mas);
    }
    // 左上角 MA 标签
    var _maLabel = document.createElement('div');
    _maLabel.style.cssText = 'position:absolute;top:8px;left:8px;background:#333;color:#f5c542;padding:3px 8px;border-radius:4px;font-size:12px;font-weight:bold;z-index:10;pointer-events:none;';
    _maLabel.textContent = 'MA' + d.best_ma;
    document.getElementById('chart-container').appendChild(_maLabel);

    // 回测指标面板
    var _mp = document.getElementById('metrics-panel');
    _mp.style.display = 'block';
    if(d.metrics && Object.keys(d.metrics).length) {
      var _html = '<div style="display:flex;flex-wrap:wrap;">';
      var _items = [
        '收益率','年化收益率','买入持有收益率','超额收益率',
        '最大回撤','夏普比率','盈利因子','盈亏比',
        '交易次数','盈利交易率','平均每笔收益率','卡尔玛比率'
      ];
      _items.forEach(function(k) {
        var v = d.metrics[k];
        if(v !== undefined) {
          _html += '<div style="flex:1;min-width:120px;padding:6px 10px;text-align:center;">';
          _html += '<div style="font-size:11px;color:#999;margin-bottom:2px;">' + k + '</div>';
          _html += '<div style="font-size:18px;font-weight:bold;color:#333;">' + _fmt(k, v) + '</div>';
          _html += '</div>';
        }
      });
      _html += '</div>';
      _mp.innerHTML = _html;
    }

    // 买卖信号（LWC v5 API: createSeriesMarkers）
    if(d.signals && d.signals.length) {
      try { LightweightCharts.createSeriesMarkers(cs, d.signals); } catch(e) { console.error("[LWC] marker error:", e); }
    }
    _lwcChart.timeScale().fitContent();

    // ── 资金曲线 ──
    if(d.equity && d.equity.length) {
      var _eqc = document.getElementById('equity-container');
      _eqc.style.display = 'block';
      _eqc.innerHTML = '<div style="padding:4px 10px;font-size:11px;color:#999;background:#fafafa;border-bottom:1px solid #e0e0e0;">资金曲线</div>';
      _eqChart = LightweightCharts.createChart(_eqc, {
        layout: { textColor: '#555', background: { type: 'solid', color: '#fff' }, fontSize: 10 },
        grid: { vertLines: { color: '#f0f0f0' }, horzLines: { color: '#f0f0f0' } },
        rightPriceScale: { borderColor: '#e0e0e0', scaleMargins: { top: 0.1, bottom: 0.2 } },
        timeScale: { borderColor: '#e0e0e0', timeVisible: false },
        height: 140,
        handleScroll: false, handleScale: false,
      });
      var _eqSeries = _eqChart.addSeries(LightweightCharts.AreaSeries, {
        lineColor: '#2196f3', topColor: 'rgba(33,150,243,0.15)', bottomColor: 'rgba(33,150,243,0.01)',
        lineWidth: 2, priceLineVisible: false,
      });
      _eqSeries.setData(d.equity);
      _eqChart.timeScale().fitContent();
    }

    // ── 交易明细表格 ──
    var _tt = document.getElementById('trade-table');
    _tt.style.display = 'none';
    if(d.trade_table && d.trade_table.length) {
      var _tbl = '<table style="width:100%;border-collapse:collapse;font-size:11px;">';
      _tbl += '<thead><tr style="background:#f5f5f5;font-weight:bold;position:sticky;top:0;z-index:1;">';
      ['订单ID','开仓时间','开仓价格','买入股数','平仓时间','平仓价格','卖出股数','交易状态','盈亏类型','收益金额','收益率','买入手续费','卖出手续费','开仓前现金','开仓后现金','平仓前现金','平仓后现金','持仓K线数'].forEach(function(h) { _tbl += '<th style="padding:4px 6px;text-align:right;border-bottom:1px solid #e0e0e0;font-size:10px;">' + h + '</th>'; });
      _tbl += '</tr></thead><tbody>';
      d.trade_table.forEach(function(r) {
        var cls = r['订单盈亏类型'] === '盈利' ? '#eef7ee' : '#fdecec';
        _tbl += '<tr style="background:' + cls + ';">';
        _tbl += '<td style="padding:3px 6px;text-align:right;font-size:11px;color:#999;">' + (r['订单ID']||'') + '</td>';
        _tbl += '<td style="padding:3px 6px;text-align:right;font-size:11px;">' + (r['开仓时间']||'') + '</td>';
        _tbl += '<td style="padding:3px 6px;text-align:right;font-size:11px;">' + (r['开仓价格']||0).toFixed(2) + '</td>';
        _tbl += '<td style="padding:3px 6px;text-align:right;font-size:11px;">' + (r['买入股数']||'') + '</td>';
        _tbl += '<td style="padding:3px 6px;text-align:right;font-size:11px;">' + (r['平仓时间']||'') + '</td>';
        _tbl += '<td style="padding:3px 6px;text-align:right;font-size:11px;">' + (r['平仓价格']||0).toFixed(2) + '</td>';
        _tbl += '<td style="padding:3px 6px;text-align:right;font-size:11px;">' + (r['卖出股数']||'') + '</td>';
        _tbl += '<td style="padding:3px 6px;text-align:right;font-size:11px;">' + (r['交易状态']||'') + '</td>';
        _tbl += '<td style="padding:3px 6px;text-align:right;font-size:11px;">' + (r['订单盈亏类型']||'') + '</td>';
        _tbl += '<td style="padding:3px 6px;text-align:right;font-size:11px;">' + (r['收益金额']||0).toFixed(2) + '</td>';
        _tbl += '<td style="padding:3px 6px;text-align:right;font-size:11px;">' + (r['收益率(%)']||0).toFixed(2) + '%</td>';
        _tbl += '<td style="padding:3px 6px;text-align:right;font-size:11px;">' + (r['买入手续费']||0).toFixed(4) + '</td>';
        _tbl += '<td style="padding:3px 6px;text-align:right;font-size:11px;">' + (r['卖出手续费']||0).toFixed(4) + '</td>';
        _tbl += '<td style="padding:3px 6px;text-align:right;font-size:11px;">' + ((r['开仓前可用现金']||0)===0?'':(r['开仓前可用现金']||0).toFixed(2)) + '</td>';
        _tbl += '<td style="padding:3px 6px;text-align:right;font-size:11px;">' + ((r['开仓后可用现金']||0)===0?'':(r['开仓后可用现金']||0).toFixed(2)) + '</td>';
        _tbl += '<td style="padding:3px 6px;text-align:right;font-size:11px;">' + ((r['平仓前可用现金']||0).toFixed(2)) + '</td>';
        _tbl += '<td style="padding:3px 6px;text-align:right;font-size:11px;">' + ((r['平仓后可用现金']||0).toFixed(2)) + '</td>';
        _tbl += '<td style="padding:3px 6px;text-align:right;font-size:11px;">' + (r['持仓K线数']||'') + '</td>';
        _tbl += '</tr>';
      });
      _tbl += '</tbody></table>';
      _tt.innerHTML = '<div style="padding:4px 10px;font-size:11px;color:#999;background:#fafafa;border-bottom:1px solid #e0e0e0;">交易明细</div>' + _tbl;
      _tt.style.display = 'block';
    }
    return;
  }

  // Plotly 渲染
  var _pl = document.getElementById('plotly-container');
  _pl.style.display = 'block';
  _pl.innerHTML = '';
  var _h = (figs[currentType].layout && figs[currentType].layout.height) || 500;
  _pl.style.height = _h + 'px';
  Plotly.react(_pl, figs[currentType].data, figs[currentType].layout, {displayModeBar:false, responsive:true});
}

init();
} catch(e) { console.error("看板初始化失败:",e); }
</script>
</body>
</html>
